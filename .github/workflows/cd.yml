name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Secrets
        run: |
          if [ -z "${{ secrets.ALIYUN_HOST }}" ]; then
            echo "::error::ALIYUN_HOST secret is not set. Please configure it in GitHub repository settings."
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set. Please configure it in GitHub repository settings."
            exit 1
          fi
          if [ -z "${{ secrets.ALIYUN_USER }}" ]; then
            echo "::error::ALIYUN_USER secret is not set. Please configure it in GitHub repository settings."
            exit 1
          fi
          echo "All required secrets are configured."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create deployment archive
        run: |
          mkdir -p deploy
          cp -r .next public package.json next.config.ts pnpm-lock.yaml pnpm-workspace.yaml ecosystem.config.js deploy/

      - name: Upload to Alibaba Cloud ECS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.ALIYUN_PORT || 22 }}
          source: 'deploy/'
          target: '${{ secrets.ALIYUN_DEPLOY_DIR }}'
          strip_components: 1

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.ALIYUN_PORT || 22 }}
          script: |
            set -e
            if ! command -v node &> /dev/null; then
              echo "Node.js is not installed on the server" && exit 1
            fi
            cd ${{ secrets.ALIYUN_DEPLOY_DIR }}
            mkdir -p logs
            if ! command -v pnpm &> /dev/null; then
              sudo npm install -g pnpm@9 2>/dev/null || npm install -g pnpm@9
            fi
            pnpm install --prod --no-frozen-lockfile
            pm2 reload ecosystem.config.js --env production 2>/dev/null || pm2 start ecosystem.config.js --env production
